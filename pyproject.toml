[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ow-short-kit"
version = "0.1.1"
description = "Local, reviewable short video workflow"
requires-python = ">=3.11,<3.14"
dependencies = ["Pillow>=11,<13"]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.150,<3", "google-auth-oauthlib>=1.2,<2"]

[project.scripts]
owshort = "owshort.cli:main"

[tool.setuptools.packages.find]
include = ["owshort*"]
